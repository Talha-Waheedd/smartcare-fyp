name: smartcare_app
description: SmartCare – AI Powered Personalized Health Assistant (FYP)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3       # FCM push notifications

  # ── Notifications ──────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2   # On-device scheduled reminders
  timezone: ^0.9.4                        # Required for scheduled notifications

  # ── UI ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true